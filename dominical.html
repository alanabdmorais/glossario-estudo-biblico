<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escola Dominical - Seletor de Lições</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e8e4d4; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; background-color: #fffef7; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
    header { background-color: #3b5e3b; color: white; padding: 20px 30px; }
    header h1 { font-size: 1.8rem; margin-bottom: 5px; }
    .seletor-area { background-color: #f9f7e8; padding: 15px 30px; border-bottom: 1px solid #d4c9a6; display: flex; flex-direction: column; gap: 15px; }
    .seletor-linha { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    .seletor-area select, .seletor-area button { padding: 8px 15px; font-size: 14px; border-radius: 6px; border: 1px solid #d4c9a6; background-color: white; }
    .seletor-area button { background-color: #3b5e3b; color: white; border: none; cursor: pointer; }
    .seletor-area button:hover { background-color: #2d4a2d; }
    .titulo-capitalizado { background-color: #e8e4d4; padding: 10px 15px; border-radius: 6px; font-weight: bold; color: #3b5e3b; border-left: 4px solid #3b5e3b; font-size: 13px; }
    section { padding: 20px 30px; border-bottom: 1px solid #d4c9a6; }
    section h2 { color: #3b5e3b; margin-bottom: 15px; font-size: 1.4rem; border-left: 4px solid #3b5e3b; padding-left: 12px; }
    .legenda-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px 20px; background: #f9f7e8; padding: 15px; border-radius: 8px; border: 1px solid #d4c9a6; }
    .legenda-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .legenda-item span:first-child { font-size: 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid #d4c9a6; padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background-color: #e8e4d4; font-weight: 600; color: #3b5e3b; }
    .col-num { width: 50px; text-align: center; }
    .col-ref { width: 130px; font-family: monospace; }
    .col-pag { width: 60px; text-align: center; }
    .mapa-estatico { background-color: #d4c9a6; height: 200px; display: flex; align-items: center; justify-content: center; border-radius: 8px; margin-bottom: 20px; color: #5c4a1e; font-weight: bold; }
    #mapaInterativo { height: 400px; border-radius: 8px; margin-bottom: 20px; }
    .netlify-section { background: #f9f7e8; padding: 15px; border-radius: 8px; border: 1px solid #d4c9a6; }
    .netlify-section input { width: 70%; padding: 8px 12px; border: 1px solid #d4c9a6; border-radius: 4px; margin-right: 10px; }
    .netlify-section button { background-color: #3b5e3b; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .contexto-card { background-color: #f9f7e8; border-left: 5px solid #3b5e3b; padding: 15px; margin-bottom: 20px; border-radius: 0 8px 8px 0; }
    .contexto-titulo { font-weight: bold; font-size: 13px; margin-bottom: 10px; color: #3b5e3b; background-color: #e8e4d4; padding: 8px; border-radius: 6px; word-break: break-word; }
    .contexto-versiculo { font-style: italic; background: white; padding: 10px; border-radius: 6px; margin: 10px 0; border: 1px solid #d4c9a6; }
    .contexto-campo { margin-bottom: 10px; font-size: 13px; }
    .contexto-campo strong { color: #5c4a1e; }
    .contexto-tags { font-size: 11px; color: #666; margin: 8px 0; background-color: #e8e4d4; padding: 5px 8px; border-radius: 4px; }
    .assuntos { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .assunto-tag { background-color: #3b5e3b; color: white; padding: 2px 8px; border-radius: 15px; font-size: 10px; }
    .vestibular { background-color: #e0dcc8; padding: 10px; border-radius: 6px; font-size: 11px; margin-top: 10px; line-height: 1.5; }
    .link-vestibular { color: #3b5e3b; text-decoration: none; font-weight: bold; border-bottom: 1px dotted #3b5e3b; cursor: pointer; }
    .link-vestibular:hover { background-color: #d4c9a6; }
    .link-volta { text-align: right; margin-top: 10px; font-size: 18px; display: flex; gap: 15px; justify-content: flex-end; }
    .link-volta a { color: #3b5e3b; text-decoration: none; }
    .link-volta a:hover { opacity: 0.7; }
    .footer-links { margin-top: 15px; text-align: right; font-size: 12px; }
    .footer-links a { color: #3b5e3b; text-decoration: none; margin-left: 15px; }
    .loading { text-align: center; padding: 40px; color: #666; }
    .modal-materia { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 2000; }
    .modal-materia-content { background: #fffef7; max-width: 700px; width: 90%; max-height: 85%; overflow-y: auto; padding: 25px; border-radius: 12px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    .modal-materia-close { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #999; }
    .modal-materia-close:hover { color: #000; }
    .modal-materia-titulo { color: #3b5e3b; margin-bottom: 15px; padding-right: 30px; font-size: 1.4rem; }
    .modal-materia-meta { margin-bottom: 20px; }
    .modal-materia-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-right: 8px; }
    .modal-materia-materia { background: #3b5e3b; color: white; }
    .modal-materia-ano { background: #d4c9a6; color: #3b5e3b; }
    .modal-materia-area { background: #e8e4d4; color: #5c4a1e; }
    .modal-materia-conteudo { line-height: 1.6; font-size: 14px; }
    .modal-materia-conteudo h3 { color: #3b5e3b; margin: 20px 0 10px; }
    .modal-materia-conteudo ul { margin-left: 20px; }
    .modal-materia-conteudo .sumario { background: #e8e4d4; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
    .modal-materia-conteudo .sumario ul { margin: 8px 0 0 20px; }
    .modal-materia-conteudo .sumario a { color: #3b5e3b; text-decoration: none; }
    .modal-materia-conteudo .sumario a:hover { text-decoration: underline; }
    .modal-materia-footer { margin-top: 25px; text-align: right; }
    .modal-materia-footer button { background: #3b5e3b; color: white; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; }
    @media (max-width: 768px) { section { padding: 15px; } .legenda-grid { grid-template-columns: repeat(3, 1fr); } .netlify-section input { width: 100%; margin-bottom: 10px; } .contexto-titulo { font-size: 11px; } .link-volta { font-size: 14px; } }
    @media print { .leaflet-container, .netlify-section, .seletor-area, button, input { display: none !important; } body { background: white; padding: 0; } .container { box-shadow: none; } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1>📖 Escola Dominical</h1>
      <a href="index.html" style="color: white; background-color: #2d4a2d; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px;">🏠 Voltar para cursos</a>
    </div>
  </header>
  <div class="seletor-area">
    <div class="seletor-linha">
      <label>Trimestre:</label>
      <select id="seletorTrimestre"><option value="2T2026">2º Trimestre 2026</option></select>
      <select id="seletorLicao">
        <option value="7">Li&ccedil;&atilde;o 7</option>
        <option value="8">Li&ccedil;&atilde;o 8</option>
        <option value="9">Li&ccedil;&atilde;o 9</option>
        <option value="10">Li&ccedil;&atilde;o 10</option>
        <option value="11">Li&ccedil;&atilde;o 11</option>
        <option value="12" selected>Li&ccedil;&atilde;o 12</option>
      </select>
      <button id="carregarBtn">🔤 Carregar Lição</button>
    </div>
    <div id="tituloDinamico" class="titulo-capitalizado">Selecione uma lição</div>
  </div>
  <div id="conteudo-principal"><div class="loading">📖 Selecione uma lição e clique em "Carregar Lição"</div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="biblioteca/contextos-biblicos.js"></script>
<script src="biblioteca/rodape-vestibular.js"></script>
<script src="biblioteca/materias-vestibular.js"></script>
<script src="biblioteca/calendario-escolar.js"></script>

<script>
  // ============================================
  // FUNÇÕES PRINCIPAIS
  // ============================================
  
  let mapaAtual = null;
  let scriptCarregado = null;
  
  const legendas = [
    ["🏁", "Aparição"], ["🔤", "Alfabética"], ["1️⃣", "Número"], ["🔘", "Categoria"],
    ["📄", "Página"], ["📂", "Subtópico"], ["🔗", "Link"],
    ["✅📖", "Versículo (até 4v) - Integral"], ["⚠️📖", "Atenção (5+v) - Síntese"],
    ["📑📖", "Capítulo - Síntese"], ["✝️", "Trecho bíblico"],
    ["💬#️⃣", "Contexto"], ["🚩", "Localização"], ["📅", "Data"], ["#️⃣", "Tags"],
    ["👑", "Líder/Rei"], ["📖", "Bíblia"],
    ["🌏⛺", "Mapa da Lição"], ["🌏", "Mapa base"], ["🗻", "Região"],
    ["🌏🔗⛺", "Mapa interativo"], ["📍", "Marcador"],
    ["⏳", "História"], ["🌋", "Geografia"], ["🎨", "Arte"], ["📝", "Literatura"],
    ["💡", "Filosofia"], ["👪", "Sociologia"], ["➕", "Matemática"], ["⚡", "Física"],
    ["⚛", "Química"], ["🌿", "Biologia"], ["📘", "Português"], ["📙", "Inglês"],
    ["🏃", "Educação Física"], ["🎓", "Ano escolar"], ["🎯", "Vestibular"],
    ["🔢", "Cronologia"], ["❓", "Questões"], ["🔑", "Gabaritos"], ["📚", "Estudo"],
    ["📜", "Obra"], ["🎥", "Filme"], ["🔃", "Ordenar"], ["🏠", "Voltar"],
    ["✔️", "Confirmar"], ["❌", "Erro"], ["❗", "Atenção"], ["ℹ️", "Informação"],
    ["🏰", "Período Humanidade"]
  ];
  
  function formatarCabecalhoContexto(ctx) {
    let cabecalho = `📖 ${ctx.referencia}`;
    if (ctx.data && ctx.data !== "") cabecalho += ` | 📅 ${ctx.data}`;
    if (ctx.local && ctx.local !== "") cabecalho += ` | 🚩 ${ctx.local}`;
    if (ctx.lider && ctx.lider !== "") {
      cabecalho += ` | 👑 ${ctx.lider}`;
      if (ctx.liderReinado && ctx.liderReinado !== "") cabecalho += ` (${ctx.liderReinado})`;
    }
    if (ctx.periodo && ctx.periodo !== "") {
      cabecalho += ` | 📜 ${ctx.periodo}`;
      if (ctx.periodoDatas && ctx.periodoDatas !== "") cabecalho += ` (${ctx.periodoDatas})`;
    }
    if (ctx.periodoHumanidade && ctx.periodoHumanidade !== "") {
      cabecalho += ` | 🏰 ${ctx.periodoHumanidade}`;
      if (ctx.periodoHumanidadeDatas && ctx.periodoHumanidadeDatas !== "") cabecalho += ` (${ctx.periodoHumanidadeDatas})`;
    }
    return cabecalho;
  }
  
  function abrirMateria(id) {
    if (typeof materiasVestibular === 'undefined' && typeof bibliotecaMaterias === 'undefined') {
      alert('Biblioteca de matérias não carregada ainda.');
      return;
    }
    const materia = (typeof materiasVestibular !== 'undefined' && materiasVestibular[id]) 
                  ? materiasVestibular[id] 
                  : (typeof bibliotecaMaterias !== 'undefined' && bibliotecaMaterias[id]) 
                    ? bibliotecaMaterias[id] 
                    : null;
    if (!materia) { alert(`Matéria "${id}" não encontrada.`); return; }
    const modalExistente = document.querySelector('.modal-materia');
    if (modalExistente) modalExistente.remove();
    const modal = document.createElement('div');
    modal.className = 'modal-materia';
    modal.innerHTML = `
      <div class="modal-materia-content">
        <span class="modal-materia-close" onclick="this.closest('.modal-materia').remove()">&times;</span>
        <h2 class="modal-materia-titulo">📖 ${materia.titulo}</h2>
        <div class="modal-materia-meta">
          <span class="modal-materia-badge modal-materia-materia">📚 ${materia.materia || 'MATÉRIA'}</span>
          <span class="modal-materia-badge modal-materia-ano">🎓 ${materia.ano || 'EM'}</span>
          <span class="modal-materia-badge modal-materia-area">🔖 ${materia.area || 'Geral'}</span>
        </div>
        <div class="modal-materia-conteudo">${materia.conteudo || '<p>Conteúdo em desenvolvimento.</p>'}</div>
        <div class="modal-materia-footer"><button onclick="this.closest('.modal-materia').remove()">Fechar</button></div>
      </div>
    `;
    document.body.appendChild(modal);
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
  }
  
  function gerarVestibularComLinks(chaveVestibular) {
    if (typeof rodapeVestibular === 'undefined' && typeof bibliotecaVestibular === 'undefined') return '';
    const vest = (typeof rodapeVestibular !== 'undefined') ? rodapeVestibular[chaveVestibular] : (typeof bibliotecaVestibular !== 'undefined') ? bibliotecaVestibular[chaveVestibular] : null;
    if (!vest) return '';
    const palavrasMap = [
      { palavra: "estoicismo", id: "estoicismo" }, { palavra: "Estoicismo", id: "estoicismo" },
      { palavra: "epicurismo", id: "epicurismo" }, { palavra: "Epicurismo", id: "epicurismo" },
      { palavra: "celtas", id: "celtas_galacia" }, { palavra: "Celtas", id: "celtas_galacia" },
      { palavra: "galácia", id: "celtas_galacia" }, { palavra: "Galácia", id: "celtas_galacia" },
      { palavra: "helenística", id: "arte_helenistica" }, { palavra: "Helenística", id: "arte_helenistica" },
      { palavra: "helenistica", id: "arte_helenistica" }, { palavra: "Helenistica", id: "arte_helenistica" },
      { palavra: "socrates", id: "socrates" }, { palavra: "Sócrates", id: "socrates" },
      { palavra: "platao", id: "platao" }, { palavra: "Platão", id: "platao" },
      { palavra: "aristoteles", id: "aristoteles" }, { palavra: "Aristóteles", id: "aristoteles" }
    ];
    const categorias = ["⏳", "🌋", "🎨", "📝", "💡", "👪"];
    let textoCorrido = '';
    for (const cat of categorias) {
      if (vest[cat]) {
        let texto = vest[cat];
        for (const item of palavrasMap) {
          const regex = new RegExp(`\\b(${item.palavra})\\b`, 'g');
          texto = texto.replace(regex, (match) => `<a href="#" class="link-vestibular" onclick="abrirMateria('${item.id}'); return false;">${match}</a>`);
        }
        textoCorrido += ` ${cat} ${texto} |`;
      }
    }
    textoCorrido = textoCorrido.replace(/\|$/, '');
    if (textoCorrido.trim() === '') return '';
    return `<div class="vestibular">🎯 VESTIBULAR: ${textoCorrido}</div>`;
  }
  
  function removerDuplicatas(lista) {
    const seen = new Map();
    const resultado = [];
    for (const item of lista) {
      const chave = item.referencia;
      if (!seen.has(chave)) { seen.set(chave, true); resultado.push(item); }
    }
    return resultado;
  }
  
  function removerScriptAnterior() {
    if (scriptCarregado && scriptCarregado.parentNode) {
      scriptCarregado.parentNode.removeChild(scriptCarregado);
      scriptCarregado = null;
    }
    if (window.dadosLicao) { delete window.dadosLicao; }
  }
  
  function destruirMapa() {
    if (mapaAtual) { mapaAtual.remove(); mapaAtual = null; }
  }
  
  function renderizarConteudo(dados) {
    console.log('✅ Renderizando:', dados.titulo);
    const tituloHeader = document.getElementById('tituloDinamico');
    if (dados.titulo) {
      tituloHeader.innerHTML = dados.titulo;
      if (dados.trimestre) tituloHeader.innerHTML += ' | ' + dados.trimestre;
      if (dados.paginas) tituloHeader.innerHTML += ' | Páginas ' + dados.paginas;
    }
    const container = document.getElementById('conteudo-principal');
    container.innerHTML = '';
    
    // ============================================
    // MONTA O LOOKUP DE CONTEXTOS
    // ============================================
    const ctxPorId = {};
    if (typeof window.contextosBiblicosMap !== 'undefined' && window.contextosBiblicosMap) {
      Object.assign(ctxPorId, window.contextosBiblicosMap);
      console.log('✅ contextosBiblicosMap carregado com', Object.keys(ctxPorId).length, 'contextos');
    } else if (typeof window.contextosBiblicos !== 'undefined' && window.contextosBiblicos) {
      window.contextosBiblicos.forEach(function(c) { if (c.id) ctxPorId[c.id] = c; });
      console.log('✅ contextosBiblicos array carregado com', Object.keys(ctxPorId).length, 'contextos');
    } else {
      console.warn('⚠️ Nenhuma biblioteca de contextos encontrada!');
    }
    
    let html = `<section id="legenda"><h2>📌 Legenda de Emojis</h2><div class="legenda-grid">`;
    legendas.forEach(leg => { html += `<div class="legenda-item"><span>${leg[0]}</span><span>${leg[1]}</span></div>`; });
    html += `</div></section>`;
    
    if (dados.listaAparicao && dados.listaAparicao.length > 0) {
      html += `<section id="aparicao"><h2>🏁 Lista 1 – Ordem de Aparição</h2><table><thead><tr><th class="col-num">1️⃣</th><th class="col-ref">📖</th><th>#️⃣</th><th>📂</th><th class="col-pag">📄</th></tr></thead><tbody>`;
      dados.listaAparicao.forEach(item => {
        const refLink = item.id ? `<a href="#${item.id}-contexto" style="color:#3b5e3b;text-decoration:none;font-weight:bold;">${item.referencia || ''}</a>` : (item.referencia || '');
        html += `<tr><td class="col-num">${item.numero}</td><td class="col-ref">${refLink}</td><td>${item.tags || ''}</td><td>${item.topico || ''}</td><td class="col-pag">${item.pagina}</td></tr>`;
      });
      html += `</tbody></table><div class="footer-links"><a href="#alfabetica">🔤 Ir para lista alfabética</a></div></section>`;
      
      let listaAlfabetica = dados.listaAlfabetica ? [...dados.listaAlfabetica] : [...dados.listaAparicao];
      listaAlfabetica = removerDuplicatas(listaAlfabetica);
      listaAlfabetica.sort((a, b) => {
        const refA = (a.referencia || '').replace(/^[0-9]+ /, '');
        const refB = (b.referencia || '').replace(/^[0-9]+ /, '');
        return refA.localeCompare(refB);
      });
      html += `<section id="alfabetica"><h2>🔤 Lista 2 – Ordem Alfabética</h2><p style="font-size: 12px; color: #666; margin-bottom: 10px;">📌 ${listaAlfabetica.length} referências únicas</p><table><thead><tr><th class="col-num">1️⃣</th><th class="col-ref">📖</th><th>#️⃣</th><th>📂</th><th class="col-pag">📄</th></tr></thead><tbody>`;
      listaAlfabetica.forEach((item, idx) => {
        const refLink = item.id ? `<a href="#${item.id}-contexto" style="color:#3b5e3b;text-decoration:none;font-weight:bold;">${item.referencia || ''}</a>` : (item.referencia || '');
        html += `<tr><td class="col-num">${idx + 1}</td><td class="col-ref">${refLink}</td><td>${item.tags || ''}</td><td>${item.topico || ''}</td><td class="col-pag">${item.pagina || ''}</td></tr>`;
      });
      html += `</tbody></table><div class="footer-links"><a href="#aparicao">🏁 Ir para lista de aparição</a></div></section>`;
    } else {
      html += `<section><h2>⚠️ Dados da Lição</h2><p>Nenhuma referência encontrada.</p></section>`;
    }
    
    html += `<section id="mapas"><h2>🌏⛺ Mapas da Lição</h2><div class="mapa-estatico">🖼️ INSIRA A IMAGEM ESTÁTICA DO MAPA AQUI</div><div id="mapaInterativo"></div>
      <div class="netlify-section"><h3>🔗 Link do Projeto (Netlify)</h3><input type="text" id="netlifyInput" placeholder="Cole o link do seu projeto no Netlify"><button id="salvarLink">Salvar Link</button><div id="linkSalvo" class="link-salvo"></div></div></section>`;
    html += `<section id="contextos"><h2>💬#️⃣ Contextos das Passagens</h2><div id="containerContextos"></div></section>`;
    container.innerHTML = html;
    
    // ============================================
    // RENDERIZA OS CARDS DE CONTEXTO
    // ============================================
    if (dados.listaAparicao && dados.listaAparicao.length > 0) {
      const containerContextos = document.getElementById('containerContextos');
      let algumContextoEncontrado = false;
      const idsJaRenderizados = new Set();
      
      dados.listaAparicao.forEach(function(item) {
        const ctxId = item.id;
        if (!ctxId) return;
        if (idsJaRenderizados.has(ctxId)) return;
        idsJaRenderizados.add(ctxId);
        
        const ctx = ctxPorId[ctxId];
        if (ctx) {
          algumContextoEncontrado = true;
          const cabecalhoContexto = formatarCabecalhoContexto(ctx);
          const localSemGovernante = ctx.local ? ctx.local.split(' // ')[0] : ctx.local;
          const chaveVestibular = `${localSemGovernante}|${ctx.data}`;
          let vestibularHtml = '';
          if (typeof rodapeVestibular !== 'undefined') vestibularHtml = gerarVestibularComLinks(chaveVestibular);
          let assuntosHtml = '';
          if (ctx.assuntos && ctx.assuntos.length > 0) {
            assuntosHtml = '<div class="assuntos">';
            ctx.assuntos.forEach(assunto => { assuntosHtml += `<span class="assunto-tag">#${assunto}</span>`; });
            assuntosHtml += '</div>';
          }
          const card = document.createElement('div');
          card.className = 'contexto-card';
          card.id = `${ctx.id}-contexto`;
          card.innerHTML = `
            <div class="contexto-titulo">${cabecalhoContexto}</div>
            <div class="contexto-campo"><strong>📜 ANTES:</strong> ${ctx.antes || 'Contexto anterior não disponível'}</div>
            <div class="contexto-versiculo"><strong>✝️ ${ctx.referencia}:</strong><br>"${ctx.versiculo || 'Versículo não disponível'}"</div>
            <div class="contexto-campo"><strong>📖 DEPOIS:</strong> ${ctx.depois || 'Contexto posterior não disponível'}</div>
            <div class="contexto-tags"><strong>#️⃣ TAGS:</strong> ${ctx.tags || ''}</div>
            ${assuntosHtml}
            ${vestibularHtml}
            <div class="link-volta">
              <a href="#aparicao" title="Voltar para lista de aparição">🏁</a>
              <a href="#alfabetica" title="Voltar para lista alfabética">🔤</a>
              <a href="#${ctx.id}" title="Voltar para este contexto na tabela">🔗</a>
            </div>
          `;
          containerContextos.appendChild(card);
        } else {
          console.warn(`⚠️ Contexto não encontrado para: ${ctxId}`);
        }
      });
      if (!algumContextoEncontrado) {
        containerContextos.innerHTML = '<p>📖 Nenhum contexto disponível para esta lição.</p>';
      }
    }
    
    // ============================================
    // MAPA
    // ============================================
    const centroMapa = (dados.mapaConfig && dados.mapaConfig.centro) ? dados.mapaConfig.centro : [20, 0];
    const zoomMapa = (dados.mapaConfig && dados.mapaConfig.zoom) ? dados.mapaConfig.zoom : 2;
    setTimeout(function() {
      const mapaDiv = document.getElementById('mapaInterativo');
      if (mapaDiv) {
        if (mapaAtual) { mapaAtual.remove(); mapaAtual = null; }
        mapaAtual = L.map('mapaInterativo').setView(centroMapa, zoomMapa);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> & CartoDB',
          subdomains: 'abcd', maxZoom: 19, minZoom: 1
        }).addTo(mapaAtual);
        if (dados.mapaConfig && dados.mapaConfig.marcadores) {
          dados.mapaConfig.marcadores.forEach(function(marcador) {
            L.marker([marcador.lat, marcador.lng]).addTo(mapaAtual).bindPopup(marcador.popup || marcador.local);
          });
        }
      }
    }, 200);
    
    // ============================================
    // NETLIFY
    // ============================================
    setTimeout(function() {
      const netlifyInput = document.getElementById('netlifyInput');
      const salvarLinkBtn = document.getElementById('salvarLink');
      const linkSalvoDiv = document.getElementById('linkSalvo');
      if (netlifyInput && salvarLinkBtn) {
        const linkSalvo = localStorage.getItem('netlifyLink');
        if (linkSalvo) { netlifyInput.value = linkSalvo; if (linkSalvoDiv) linkSalvoDiv.innerHTML = `✅ Link salvo: <a href="${linkSalvo}" target="_blank">${linkSalvo}</a>`; }
        salvarLinkBtn.onclick = function() {
          const link = netlifyInput.value.trim();
          if (link) { localStorage.setItem('netlifyLink', link); if (linkSalvoDiv) linkSalvoDiv.innerHTML = `✅ Link salvo: <a href="${link}" target="_blank">${link}</a>`; alert('Link salvo!'); } 
          else { alert('Digite um link válido.'); }
        };
      }
    }, 200);
  }
  
  // ============================================
  // CARREGAR LIÇÃO
  // ============================================
  
  function carregarLicao() {
    const trimestre = document.getElementById('seletorTrimestre').value;
    const licao = document.getElementById('seletorLicao').value;
    
    console.log(`🔄 Carregando Lição ${licao}...`);
    
    removerScriptAnterior();
    destruirMapa();
    
    const container = document.getElementById('conteudo-principal');
    container.innerHTML = '<div class="loading">📖 Carregando lição ' + licao + '...</div>';
    
    const tituloHeader = document.getElementById('tituloDinamico');
    tituloHeader.innerHTML = '⏳ Carregando lição ' + licao + '...';
    
    const script = document.createElement('script');
    const timestamp = Date.now();
    script.src = `dados/dominical/dados-${trimestre}-licao${licao}.js?v=${timestamp}`;
    scriptCarregado = script;
    
    script.onload = function() {
      setTimeout(() => {
        if (typeof window.dadosLicao !== 'undefined' && window.dadosLicao) {
          console.log(`✅ Lição carregada: ${licao}`, window.dadosLicao.titulo);
          renderizarConteudo(window.dadosLicao);
        } else {
          container.innerHTML = `<div class="loading">❌ Erro: Dados da lição ${licao} não encontrados.</div>`;
          tituloHeader.innerHTML = `❌ Falha ao carregar lição ${licao}`;
        }
      }, 100);
    };
    
    script.onerror = function() {
      container.innerHTML = `<div class="loading">❌ Arquivo não encontrado: dados/dominical/dados-${trimestre}-licao${licao}.js</div>`;
      tituloHeader.innerHTML = `❌ Lição ${licao} não disponível`;
    };
    
    document.body.appendChild(script);
  }
  
  // ============================================
  // TORNAR FUNÇÕES GLOBAIS
  // ============================================
  window.carregarLicao = carregarLicao;
  window.renderizarConteudo = renderizarConteudo;
  
  // ============================================
  // EVENTOS
  // ============================================
  document.getElementById('carregarBtn').addEventListener('click', function() {
    carregarLicao();
  });
  
  document.addEventListener('DOMContentLoaded', function() {
    carregarLicao();
  });
  
  console.log('📖 Página da Escola Dominical carregada!');
</script>
</body>
</html>
