<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monte Efraim - Juízes 17:6</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0ebe4;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.12);
            overflow: hidden;
        }
        
        .header {
            background: #1a2a3a;
            color: white;
            padding: 16px 24px;
            border-bottom: 4px solid #d4a24e;
        }
        
        .header h1 { font-size: 20px; font-weight: 600; }
        .header h1 span { color: #d4a24e; }
        .header .ref {
            display: inline-block;
            background: rgba(212, 162, 78, 0.2);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #d4a24e;
            font-weight: 500;
            margin-top: 2px;
        }
        
        #map {
            width: 100%;
            height: 500px;
            background: #d5d5d5;
        }
        
        .footer {
            padding: 10px 24px;
            background: #f0ebe4;
            font-size: 12px;
            color: #7a8a9a;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .footer a { color: #4a6a8a; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        
        .leaflet-popup-content { font-size: 14px; line-height: 1.6; min-width: 200px; }
        .leaflet-popup-content .titulo { font-weight: 700; color: #1a2a3a; font-size: 16px; }
        .leaflet-popup-content .ref { color: #b8860b; font-weight: 600; }
        
        @media (max-width: 600px) {
            #map { height: 350px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⛰️ Monte <span>Efraim</span></h1>
        <div class="ref">📖 Juízes 17:6</div>
    </div>
    
    <div id="map"></div>
    
    <div class="footer">
        <span>🗺️ <a href="https://www.maptiler.com" target="_blank">MapTiler</a></span>
        <span>📍 Monte Efraim, Israel</span>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const API_KEY = 'Y2u7054YmGNhLFFJ6Ves';

const LOCAL = {
    nome: 'Monte Efraim',
    lat: 32.2329,
    lng: 35.2730,
    ref: 'Jz 17:6'
};

const map = L.map('map', {
    center: [LOCAL.lat, LOCAL.lng],
    zoom: 9
});

// ================================================================
// SOLUÇÃO 1: MapTiler com estilo 'basic' (gratuito)
// ================================================================
// O estilo 'basic' é gratuito e suporta o parâmetro language=pt
// Documentação: https://docs.maptiler.com/cloud/api/tiles/#basic

L.tileLayer(`https://api.maptiler.com/maps/basic/{z}/{x}/{y}.png?key=${API_KEY}&language=pt`, {
    attribution: '&copy; <a href="https://www.maptiler.com">MapTiler</a>',
    maxZoom: 19
}).addTo(map);

const icon = L.icon({
    iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

L.marker([LOCAL.lat, LOCAL.lng], { icon: icon })
    .addTo(map)
    .bindPopup(`
        <div style="text-align: center;">
            <div class="titulo">⛰️ ${LOCAL.nome}</div>
            <div class="ref">📖 ${LOCAL.ref}</div>
            <div style="font-size: 12px; color: #8a9aaa; margin-top: 4px;">
                ${LOCAL.lat.toFixed(4)}°N, ${LOCAL.lng.toFixed(4)}°E
            </div>
        </div>
    `)
    .openPopup();

L.control.scale({
    position: 'bottomright',
    imperial: false,
    metric: true
}).addTo(map);

console.log('✅ SOLUÇÃO 1: MapTiler BASIC (gratuito)');
console.log('🗺️ Idioma: português (language=pt)');
</script>

</body>
</html>
