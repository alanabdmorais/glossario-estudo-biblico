<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glossário - Estudo Bíblico</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e8e4d4 0%, #d4c9a6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      background-color: #fffef7;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
    }
    .header {
      background-color: #3b5e3b;
      color: white;
      padding: 30px;
    }
    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }
    .header p {
      opacity: 0.9;
      font-size: 0.9rem;
    }
    .cursos {
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background-color: #f9f7e8;
      border-radius: 12px;
      padding: 25px;
      text-decoration: none;
      color: #333;
      border: 1px solid #d4c9a6;
      transition: all 0.3s ease;
      display: block;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      border-color: #3b5e3b;
    }
    .card h2 {
      color: #3b5e3b;
      margin-bottom: 10px;
      font-size: 1.5rem;
    }
    .card p {
      color: #666;
      font-size: 0.9rem;
    }
    .emoji {
      font-size: 3rem;
      margin-bottom: 10px;
    }
    .footer {
      background-color: #e8e4d4;
      padding: 15px;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📖 Glossário de Estudo Bíblico</h1>
      <p>Selecione um curso para começar</p>
    </div>
    <div class="cursos">
      <a href="teologia.html" class="card">
        <div class="emoji">📘</div>
        <h2>Teologia Descomplicada</h2>
        <p>Curso para jovens • Livro 4 • Capítulos 5, 6 e 7</p>
      </a>
      <a href="dominical-v2.html" class="card">
        <div class="emoji">📖</div>
        <h2>Escola Dominical</h2>
        <p>3º Trimestre 2026 • Lição 1 — O Livro de Juízes</p>
      </a>
    </div>
    <div class="footer">
      <p>📍 Estudo bíblico com contextos históricos e dados para vestibular</p>
    </div>
  </div>
</body>
</html>
